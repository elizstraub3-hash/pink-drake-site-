<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pink Drake 💕</title>
  <meta name="description" content="Pink Drake – sua loja de maquiagem online. Pedidos via WhatsApp.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="header">
    <div class="hinner">
      <a href="index.html" class="logo-wrap">
        <img src="img/logo-white.png" alt="Pink Drake" class="logo-img"
             onerror="this.style.display='none';document.querySelector('.logo-fallback').style.display='block'">
        <span class="logo-fallback" style="display:none">Pink Drake</span>
      </a>
      <div class="h-actions">
        <button class="btn-cart" onclick="toggleCart()">
          🛍️ Carrinho
          <span class="cart-badge" id="cartBadge">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-content">
      <img src="img/logo-white.png" alt="Pink Drake" class="hero-logo-img"
           onerror="this.style.display='none';document.querySelector('.hero-logo-text').style.display='block'">
      <div class="hero-logo-text" style="display:none">Pink Drake</div>
      <p class="hero-sub">Beleza & Make para todas as ocasiões ✨</p>
      <button class="btn-hero" onclick="scrollToProducts()">Ver Produtos</button>
    </div>
  </section>

  <!-- PRODUCTS -->
  <section class="products-section" id="products">
    <div class="container">
      <h2 class="section-title" id="catTitle">Nossos Produtos 💄</h2>
      <div class="cat-dropdown-wrap">
        <select id="catSelect" onchange="filterCatSelect(this)">
          <option value="all">✨ Todos os Produtos</option>
        </select>
        <span class="cat-arrow">▼</span>
      </div>
      <div class="products-grid" id="productsGrid">
        <!-- populated by JS -->
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-logo-text">Pink Drake</div>
    <p>Pedidos via WhatsApp 💕</p>
    <p><a href="https://wa.me/554184999861">(41) 8499-9861</a></p>
    <p style="margin-top:12px;opacity:.65;font-size:.78rem">&copy; 2024 Pink Drake · Todos os direitos reservados</p>
    <div class="footer-secret" onclick="footerSecret()" title=""></div>
  </footer>

  <!-- CART OVERLAY -->
  <div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

  <!-- CART SIDEBAR -->
  <aside class="cart-side" id="cartSide">
    <div class="cart-head">
      <h3>🛍️ Meu Carrinho</h3>
      <button class="btn-close-cart" onclick="closeCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty"><span>🛍️</span><p>Carrinho vazio</p></div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none">
      <div class="cart-total">
        <span>Total:</span>
        <strong id="cartTotalAmt">R$ 0,00</strong>
      </div>
      <button class="btn-checkout" onclick="openCheckout()">
        💬 Finalizar pelo WhatsApp
      </button>
    </div>
  </aside>

  <!-- CHECKOUT MODAL -->
  <div class="modal-overlay" id="checkoutOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3>Finalizar Pedido 💕</h3>
        <button class="btn-close-modal" onclick="closeCheckout()">✕</button>
      </div>
      <div class="modal-body">

        <div class="fg">
          <label>Seu nome *</label>
          <input type="text" id="cName" placeholder="Como você se chama?" required>
        </div>
        <div class="fg">
          <label>Telefone (opcional)</label>
          <input type="tel" id="cPhone" placeholder="(41) 9 9999-9999">
        </div>

        <div class="fg">
          <label>Tipo de recebimento *</label>
          <div class="toggle-btns">
            <button type="button" class="toggle-btn active" id="btnPickup" onclick="setDelivery('pickup')">
              🏪 Retirada
            </button>
            <button type="button" class="toggle-btn" id="btnDelivery" onclick="setDelivery('delivery')">
              🛵 Entrega
            </button>
          </div>
        </div>

        <div class="fg" id="addrGroup" style="display:none">
          <label>Endereço de entrega *</label>
          <textarea id="cAddr" rows="3" placeholder="Rua, número, bairro, cidade..."></textarea>
        </div>

        <div class="fg">
          <label>Observações (opcional)</label>
          <textarea id="cNotes" rows="2" placeholder="Alguma observação sobre o pedido?"></textarea>
        </div>

        <div class="order-summary">
          <h4>Resumo do Pedido</h4>
          <div id="sumItems"></div>
          <div class="sum-total">
            <span>Total:</span>
            <strong id="sumTotal">R$ 0,00</strong>
          </div>
        </div>

      </div>
      <div class="modal-foot">
        <button class="btn-wa" onclick="sendWhatsApp()">
          💬 Enviar Pedido no WhatsApp
        </button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
